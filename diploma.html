<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diploma Oficial - TecnoCampus</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5624d0">
</head>
<body style="background: #111213; padding: 2rem 0;">

    <div class="main-container" style="text-align: center;">
        <div class="diploma-box">
            <div style="font-size: 3rem; color: #d97706; margin-bottom: 0.5rem;"><i class="fa-solid fa-award"></i></div>
            <h1 style="color: #78350f; font-size: 1.8rem; margin: 0;">CERTIFICADO DE APROBACIÓN</h1>
            <p style="color: #555; font-size: 0.95rem; margin: 0.5rem 0;">La institución <strong>TecnoCampus Guatemala</strong> certifica que:</p>
            
            <h2 id="nombreEstudianteDiploma" style="color: #1c1d1f; font-size: 1.8rem; margin: 1rem 0;">[Nombre del Alumno]</h2>
            
            <p style="color: #555; font-size: 0.95rem; margin: 0;">Completó exitosamente el curso oficial con la calificación de:</p>
            <h3 id="calificacionDiploma" style="color: #198754; font-size: 2.2rem; margin: 0.5rem 0;">100 / 100</h3>
            
            <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
                <button onclick="window.print()" class="btn-subscribe" style="max-width: 220px; background:#198754;"><i class="fa-solid fa-print"></i> Descargar PDF</button>
                <button onclick="volverAlPanel()" class="btn-subscribe" style="max-width: 220px; background:#4b5563;"><i class="fa-solid fa-arrow-left"></i> Volver</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const nombreTemp = localStorage.getItem("nombreDiplomaTemp");
            const usuarioActivo = JSON.parse(localStorage.getItem("usuarioActivo"));
            const nombreFinal = nombreTemp || (usuarioActivo ? usuarioActivo.nombre : "Estudiante");

            document.getElementById("nombreEstudianteDiploma").textContent = nombreFinal;
            document.getElementById("calificacionDiploma").textContent = `${localStorage.getItem("notaFinal") || "100"} / 100`;
        });
    </script>
    <script src="main.js"></script>
</body>
</html>
